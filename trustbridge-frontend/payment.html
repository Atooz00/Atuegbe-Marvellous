<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout - TrustBridge</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: var(--background-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .checkout-container {
      width: 100%;
      max-width: 450px;
    }
    .checkout-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }
    .checkout-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #E8F5E9;
      color: #2E7D32;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px dashed #E0E0E0;
      color: var(--text-muted);
    }
    .summary-row:last-of-type { border-bottom: none; }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 1rem 0;
      margin-top: 0.5rem;
      border-top: 2px solid #E0E0E0;
      font-weight: 700;
      font-size: 1.25rem;
      color: #121212;
    }

    .payment-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .payment-overlay.active { display: flex; }

    /* Larger specialized spinner for payment */
    .pay-spinner {
      border: 4px solid #E8F5E9;
      border-radius: 50%;
      border-top: 4px solid #2E7D32;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-card">
      <div class="checkout-header">
        <div class="secure-badge">🔒 Bank-Grade Security</div>
        <h2>Fund Escrow</h2>
        <p class="text-muted" id="tx-title">Loading transaction...</p>
      </div>

      <div style="background: #F9FAFB; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
        <div class="summary-row">
          <span>Item Price</span>
          <span id="price-val">₦0.00</span>
        </div>
        <div class="summary-row">
          <span>TrustBridge Fee (1.5%)</span>
          <span id="fee-val">₦0.00</span>
        </div>
        <div class="total-row">
          <span>Total to Pay</span>
          <span id="total-val" style="color:#1B5E20;">₦0.00</span>
        </div>
      </div>

      <button id="pay-btn" class="btn btn-primary btn-block pulse-anim" style="font-size: 1.1rem; padding: 1rem;">
        Secure Payment
      </button>

      <div style="text-align: center; margin-top: 1rem;">
        <button onclick="history.back()" class="btn btn-outline" style="border:none; padding:0.5rem;">Cancel</button>
      </div>

      <!-- Loading Overlay -->
      <div class="payment-overlay" id="loading-overlay">
        <div class="pay-spinner"></div>
        <h3 style="color:#2E7D32;">Processing Payment...</h3>
        <p class="text-muted">Securing funds in escrow</p>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Must be logged in as buyer
      const role = window.tbApp.checkAuth('buyer');
      if (!role) return;

      const urlParams = new URLSearchParams(window.location.search);
      const txId = urlParams.get('id');
      if (!txId) {
        alert("Transaction ID missing.");
        window.location.href = 'buyer-dashboard.html';
        return;
      }

      const tx = window.tbUtils.getTransaction(txId);
      if (!tx || tx.status !== 'created') {
        alert("Invalid transaction or already funded.");
        window.location.href = 'buyer-dashboard.html';
        return;
      }

      // Calculate fee and total
      const fee = window.tbUtils.calculateFee(tx.price);
      const total = tx.price + fee;

      // Populate UI
      document.getElementById('tx-title').textContent = `${tx.id} • ${tx.title}`;
      document.getElementById('price-val').textContent = window.tbUtils.formatNaira(tx.price);
      document.getElementById('fee-val').textContent = window.tbUtils.formatNaira(fee);
      document.getElementById('total-val').textContent = window.tbUtils.formatNaira(total);

      // Handle Payment Mock
      document.getElementById('pay-btn').addEventListener('click', () => {
        const overlay = document.getElementById('loading-overlay');
        overlay.classList.add('active');

        // Mock network delay of 2.5 seconds
        setTimeout(() => {
          window.tbUtils.updateTransactionStatus(txId, 'funded');
          window.location.href = `transaction.html?id=${txId}&payment=success`;
        }, 2500);
      });
    });
  </script>
</body>
</html>
